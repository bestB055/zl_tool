<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCS解析 - 带班首页</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-start: #eef4ff;
            --bg-end: #f8fbff;
            --primary: #246bfe;
            --primary-dark: #1749b6;
            --text: #162033;
            --muted: #667085;
            --card: rgba(255, 255, 255, 0.88);
            --border: rgba(36, 107, 254, 0.12);
            --shadow: 0 20px 60px rgba(21, 54, 120, 0.12);
            --green: #12a150;
            --red: #d92d20;
            --amber: #dc6803;
        }

        body {
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text);
            background:
                radial-gradient(circle at top left, rgba(36, 107, 254, 0.18), transparent 32%),
                linear-gradient(135deg, var(--bg-start), var(--bg-end));
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            width: min(1180px, calc(100% - 32px));
            margin: 0 auto;
            padding: 42px 0 56px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--primary);
            font-weight: 700;
            font-size: 0.94rem;
            transition: opacity 0.2s;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .section {
            background: var(--card);
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 26px;
        }

        .hero {
            margin-top: 20px;
            margin-bottom: 24px;
        }

        .hero h1 {
            font-size: clamp(1.6rem, 4vw, 2.2rem);
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }

        .hero-desc {
            color: var(--muted);
            font-size: 0.94rem;
            line-height: 1.6;
        }

        .tab-bar {
            display: flex;
            gap: 4px;
            margin-bottom: 16px;
        }

        .tab-btn {
            padding: 10px 22px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.6);
            color: var(--muted);
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .json-textarea {
            width: 100%;
            min-height: 200px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.7);
            color: var(--text);
            font: 0.9rem/1.7 "SF Mono", "Fira Code", "Consolas", monospace;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .json-textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(36, 107, 254, 0.1);
        }

        .file-upload-area {
            display: flex;
            align-items: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .file-label {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 20px;
            border: 2px dashed var(--border);
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.5);
            color: var(--muted);
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .file-label:hover {
            border-color: var(--primary);
            background: rgba(36, 107, 254, 0.04);
        }

        .file-label.has-file {
            border-style: solid;
            border-color: var(--green);
            color: var(--green);
            background: rgba(18, 161, 80, 0.06);
        }

        .file-input {
            display: none;
        }

        .file-name {
            color: var(--muted);
            font-size: 0.88rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 42px;
            padding: 0 20px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: #fff;
            color: var(--primary-dark);
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(36, 107, 254, 0.12);
        }

        .btn.primary {
            border-color: var(--primary);
            background: var(--primary);
            color: #fff;
        }

        .btn.green {
            border-color: var(--green);
            background: var(--green);
            color: #fff;
        }

        .btn.danger {
            border-color: var(--red);
            background: var(--red);
            color: #fff;
        }

        .parse-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .parse-status {
            color: var(--muted);
            font-size: 0.88rem;
        }

        .results-section {
            margin-top: 18px;
            padding: 0;
            border: 0;
            background: transparent;
            box-shadow: none;
            backdrop-filter: none;
        }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 12px;
        }

        .results-count {
            color: var(--muted);
            font-size: 0.84rem;
            font-weight: 700;
        }

        .result-navigation {
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .nav-btn {
            min-height: 34px;
            padding: 0 12px;
            border: 1px solid rgba(36, 107, 254, 0.16);
            border-radius: 10px;
            background: #fff;
            color: var(--primary-dark);
            font-weight: 800;
            cursor: pointer;
        }

        .nav-btn:disabled {
            color: #98a2b3;
            cursor: not-allowed;
            background: #f5f7fa;
        }

        .page-indicator {
            min-width: 76px;
            color: var(--text);
            font-size: 0.84rem;
            font-weight: 800;
            text-align: center;
        }

        .export-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .field-picker {
            position: relative;
        }

        .field-picker > summary {
            list-style: none;
        }

        .field-picker > summary::-webkit-details-marker {
            display: none;
        }

        .field-picker-menu {
            position: absolute;
            z-index: 20;
            top: calc(100% + 8px);
            right: 0;
            width: min(420px, 85vw);
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: #fff;
            box-shadow: 0 12px 30px rgba(16, 24, 40, 0.16);
        }

        .field-picker-actions {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }

        .field-picker-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 7px 12px;
            max-height: 320px;
            overflow-y: auto;
        }

        .field-picker-option {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            font-size: 0.78rem;
            overflow-wrap: anywhere;
        }

        .record-card {
            background: #fff;
            border: 1px solid rgba(36, 107, 254, 0.14);
            border-radius: 10px;
            overflow: hidden;
        }

        .record-header {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: stretch;
            padding: 0;
            background: #fff;
            border-bottom: 1px solid var(--border);
        }

        .record-identity {
            min-width: 0;
            padding: 12px 16px;
        }

        .record-source-line {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 7px;
        }

        .record-number {
            color: var(--primary-dark);
            font-size: 0.82rem;
            font-weight: 850;
        }

        .record-source {
            color: var(--text);
            font-size: 0.92rem;
            font-weight: 800;
        }

        .record-info-line {
            margin-top: 3px;
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.45;
        }

        .record-info-line strong {
            color: #475467;
            font-weight: 700;
        }

        .push-status-panel {
            display: flex;
            min-width: 246px;
            border-left: 1px solid var(--border);
        }

        .push-status-option {
            display: grid;
            min-width: 82px;
            place-content: center;
            gap: 3px;
            padding: 8px 12px;
            border-right: 1px solid var(--border);
            background: #f8fafc;
            color: #98a2b3;
            text-align: center;
        }

        .push-status-option:last-child {
            border-right: 0;
        }

        .push-status-option strong {
            font-size: 1rem;
            line-height: 1;
        }

        .push-status-option small {
            font-size: 0.68rem;
            font-weight: 700;
        }

        .push-status-option.active.yes {
            background: rgba(18, 161, 80, 0.12);
            color: #027a48;
        }

        .push-status-option.active.pc {
            background: rgba(247, 184, 1, 0.18);
            color: #9a6700;
        }

        .push-status-option.active.no {
            background: rgba(217, 45, 32, 0.1);
            color: #b42318;
        }

        .timeliness-line {
            padding: 7px 16px;
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
            color: #475467;
            font-size: 0.78rem;
            font-weight: 650;
        }

        .record-block {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .record-block:last-child {
            border-bottom: 0;
        }

        .block-title {
            margin-bottom: 8px;
            font-size: 0.86rem;
        }

        .review-context {
            display: grid;
            grid-template-columns: minmax(0, 1.25fr) minmax(320px, 0.75fr);
            gap: 14px;
        }

        .review-context-column {
            min-width: 0;
        }

        .review-context-column + .review-context-column {
            padding-left: 14px;
            border-left: 1px solid var(--border);
        }

        .origin-text {
            padding: 9px 11px;
            border: 1px solid rgba(36, 107, 254, 0.1);
            border-radius: 8px;
            background: #f8fafc;
            font-size: 0.84rem;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        .candidate-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            overflow: hidden;
            gap: 1px;
            border: 1px solid rgba(36, 107, 254, 0.12);
            border-radius: 8px;
            background: rgba(36, 107, 254, 0.12);
        }

        .candidate-card {
            display: grid;
            grid-template-rows: auto 1fr auto;
            gap: 6px;
            min-width: 0;
            padding: 10px 11px;
            border: 0;
            border-radius: 0;
            background: #fff;
        }

        .candidate-topline,
        .candidate-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-wrap: wrap;
        }

        .candidate-index {
            color: var(--muted);
            font-size: 0.74rem;
            font-weight: 700;
        }

        .audit-badge {
            display: inline-flex;
            align-items: center;
            min-height: 22px;
            padding: 0 8px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
        }

        .audit-badge.pass {
            background: rgba(18, 161, 80, 0.12);
            color: #027a48;
        }

        .audit-badge.refuse {
            background: rgba(217, 45, 32, 0.1);
            color: var(--red);
        }

        .audit-badge.unknown {
            background: rgba(102, 112, 133, 0.1);
            color: var(--muted);
        }

        .candidate-title {
            font-size: 0.86rem;
            font-weight: 700;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .candidate-content {
            padding-top: 7px;
            border-top: 1px solid var(--border);
            color: #344054;
            font-size: 0.8rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .candidate-meta {
            color: var(--muted);
            font-size: 0.7rem;
            line-height: 1.4;
        }

        .machine-audit {
            display: grid;
            gap: 7px;
        }

        .fuse-label-summary {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: rgba(36, 107, 254, 0.05);
        }

        .fuse-label-item {
            min-width: 0;
            padding: 10px 12px;
            border: 1px solid rgba(36, 107, 254, 0.16);
            border-radius: 8px;
            background: #fff;
        }

        .fuse-label-key {
            display: block;
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 700;
        }

        .fuse-label-value {
            color: var(--primary-dark);
            font-size: 1rem;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .machine-audit-item {
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto;
            align-items: start;
            gap: 8px;
            padding: 9px 10px;
            border: 1px solid rgba(36, 107, 254, 0.1);
            border-radius: 8px;
            background: #f8fafc;
        }

        .machine-name {
            display: block;
            margin-bottom: 4px;
            color: var(--muted);
            font-size: 0.72rem;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .machine-text {
            display: block;
            font-size: 0.8rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .material-review-list {
            display: grid;
            gap: 8px;
        }

        .material-review-item {
            overflow: hidden;
            border: 1px solid rgba(36, 107, 254, 0.12);
            border-radius: 8px;
            background: #fff;
        }

        .material-review-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 7px 10px;
            border-bottom: 1px solid var(--border);
            background: #f8fafc;
        }

        .material-key {
            color: #475467;
            font-size: 0.76rem;
            font-weight: 800;
            overflow-wrap: anywhere;
        }

        .material-value {
            padding: 10px;
            font-size: 0.86rem;
            line-height: 1.6;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .material-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px 14px;
            padding: 7px 10px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.72rem;
        }

        .details-toggle {
            width: 100%;
        }

        .details-toggle summary {
            color: var(--primary-dark);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            user-select: none;
        }

        .details-toggle .field-table {
            margin-top: 12px;
            border: 1px solid var(--border);
        }

        .field-table {
            width: 100%;
            border-collapse: collapse;
        }

        .field-table td {
            padding: 6px 10px;
            border-bottom: 1px solid rgba(36, 107, 254, 0.06);
            font-size: 0.78rem;
            line-height: 1.4;
            vertical-align: top;
        }

        .field-table tr:last-child td {
            border-bottom: none;
        }

        .field-name {
            width: 180px;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.76rem;
            white-space: nowrap;
            padding-right: 12px;
        }

        .field-value {
            word-break: break-all;
        }

        .field-value.empty {
            color: #c0c5cc;
            font-style: italic;
        }

        .field-value.pass {
            color: var(--green);
            font-weight: 700;
        }

        .field-value.refuse {
            color: var(--red);
            font-weight: 700;
        }

        .field-value.timestamp {
            color: var(--primary-dark);
            font-weight: 600;
        }

        .field-value.long-text {
            max-height: 80px;
            overflow-y: auto;
            display: block;
            background: rgba(0, 0, 0, 0.02);
            padding: 6px 10px;
            border-radius: 8px;
            font-size: 0.82rem;
        }

        .empty-state {
            text-align: center;
            padding: 48px 20px;
            color: var(--muted);
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%) translateY(20px);
            padding: 12px 18px;
            border-radius: 999px;
            background: rgba(22, 32, 51, 0.92);
            color: #fff;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 10;
            font-size: 0.88rem;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 640px) {
            .page {
                width: min(100% - 24px, 1180px);
                padding-top: 24px;
            }

            .section {
                border-radius: 20px;
                padding: 18px;
            }

            .field-name {
                width: 120px;
            }

            .field-table td {
                padding: 8px 12px;
            }

            .record-header {
                grid-template-columns: 1fr;
            }

            .export-bar {
                flex-direction: column;
            }

            .candidate-list,
            .review-context {
                grid-template-columns: 1fr;
            }

            .push-status-panel {
                min-width: 0;
                border-top: 1px solid var(--border);
                border-left: 0;
            }

            .push-status-option {
                flex: 1;
                min-width: 0;
            }

            .review-context-column + .review-context-column {
                padding-top: 12px;
                padding-left: 0;
                border-top: 1px solid var(--border);
                border-left: 0;
            }

            .machine-audit-item {
                grid-template-columns: minmax(0, 1fr) auto;
            }
        }
    </style>
</head>
<body>
    <main class="page">
        <div class="topbar">
            <a class="back-link" href="home.html">← 返回带班首页</a>
        </div>

        <section class="hero">
            <h1>TCS解析</h1>
            <p class="hero-desc">解析并导出TCS审核结果。</p>
        </section>

        <section class="section" id="inputSection">
            <div class="tab-bar">
                <button class="tab-btn active" data-tab="text">文本粘贴</button>
                <button class="tab-btn" data-tab="file">文件上传</button>
            </div>

            <div class="tab-panel active" id="textPanel">
                <div class="input-area">
                    <textarea class="json-textarea" id="jsonInput" placeholder="在此粘贴一条或多条 JSON 数据，系统将自动识别 TCS mainForm 或 DouyinSubmissionInfo 格式。&#10;&#10;支持格式：&#10;  - 单条 JSON 对象&#10;  - JSON 数组 [{...}, {...}]&#10;  - 多行 JSON（每行一条）"></textarea>
                    <div class="parse-bar">
                        <button class="btn primary" id="textParseBtn">解析</button>
                        <span class="parse-status" id="textParseStatus"></span>
                    </div>
                </div>
            </div>

            <div class="tab-panel" id="filePanel">
                <div class="input-area">
                    <div class="file-upload-area">
                        <label class="file-label" id="fileLabel" for="fileInput">
                            <span id="fileLabelText">选择 Excel 文件</span>
                        </label>
                        <input class="file-input" type="file" id="fileInput" accept=".xlsx,.xls">
                        <span class="file-name" id="fileName"></span>
                    </div>
                    <p style="color:var(--muted);font-size:0.84rem;">上传包含【1_审核记录】列的 Excel 文件，系统将自动解析该列中的 JSON 数据。</p>
                    <div class="parse-bar">
                        <button class="btn primary" id="fileParseBtn">解析</button>
                        <span class="parse-status" id="fileParseStatus"></span>
                    </div>
                </div>
            </div>
        </section>

        <section class="section results-section" id="resultsSection" style="display:none;">
            <div class="results-header">
                <span class="results-count" id="resultsCount"></span>
                <div class="result-navigation" id="resultNavigation">
                    <button class="nav-btn" type="button" id="previousCaseBtn">← 上一条</button>
                    <span class="page-indicator" id="pageIndicator">0 / 0</span>
                    <button class="nav-btn" type="button" id="nextCaseBtn">下一条 →</button>
                </div>
                <div class="export-bar">
                    <details class="field-picker" id="exportFieldPicker">
                        <summary class="btn">选择字段</summary>
                        <div class="field-picker-menu">
                            <div class="field-picker-actions">
                                <button class="btn" type="button" id="selectAllFieldsBtn">全选</button>
                                <button class="btn" type="button" id="clearAllFieldsBtn">清空</button>
                            </div>
                            <div class="field-picker-list" id="exportFieldList"></div>
                        </div>
                    </details>
                    <button class="btn green" id="exportExcelBtn">导出 Excel</button>
                    <button class="btn" id="copyResultBtn">复制结果</button>
                    <button class="btn" id="feishuSheetBtn">复制并打开飞书表格</button>
                </div>
            </div>
            <div id="resultsContainer"></div>
        </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script>
        const toast = document.getElementById('toast');
        const resultsSection = document.getElementById('resultsSection');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsCount = document.getElementById('resultsCount');
        const pageIndicator = document.getElementById('pageIndicator');
        const previousCaseBtn = document.getElementById('previousCaseBtn');
        const nextCaseBtn = document.getElementById('nextCaseBtn');
        const exportFieldList = document.getElementById('exportFieldList');
        let toastTimer = null;
        let parsedRecords = [];
        let selectedExportFields = new Set();
        let currentRecordIndex = 0;
        let lastCaseNavigationAt = 0;

        function showToast(message) {
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('show'), 2200);
        }

        function formatTimestamp(ts) {
            if (ts === null || ts === undefined || ts === '') return '';
            const num = Number(ts);
            if (isNaN(num)) return String(ts);
            const date = new Date(num > 100000000000 ? num : num * 1000);
            const Y = date.getFullYear();
            const M = String(date.getMonth() + 1).padStart(2, '0');
            const D = String(date.getDate()).padStart(2, '0');
            const h = String(date.getHours()).padStart(2, '0');
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            return `${Y}-${M}-${D} ${h}:${m}:${s}`;
        }

        function shouldSkipField(name) {
            return name && name.startsWith('agent_aigc_text_audit_res_');
        }

        function preserveLargeIntegers(text) {
            let output = '';
            let inString = false;
            let escaped = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (inString) {
                    output += char;
                    if (escaped) escaped = false;
                    else if (char === '\\') escaped = true;
                    else if (char === '"') inString = false;
                    continue;
                }
                if (char === '"') {
                    inString = true;
                    output += char;
                    continue;
                }
                if (char === '-' || /\d/.test(char)) {
                    const match = text.slice(i).match(/^-?\d+/);
                    const token = match ? match[0] : char;
                    const previous = output.trimEnd().slice(-1);
                    const next = text.slice(i + token.length).trimStart()[0];
                    if (token.replace('-', '').length >= 16 && /[:\[,]$/.test(previous) && /[,}\]]/.test(next)) {
                        output += `"${token}"`;
                    } else {
                        output += token;
                    }
                    i += token.length - 1;
                    continue;
                }
                output += char;
            }
            return output;
        }

        function normalizeJsonSource(text) {
            return String(text ?? '')
                .replace(/^\uFEFF/, '')
                .replace(/^\s*```(?:json|javascript|js)?\s*/i, '')
                .replace(/\s*```\s*$/, '')
                .split(/\r?\n/)
                .map(line => line.replace(/^\s*\/\/\s?(?=[{["'])/, ''))
                .join('\n')
                .trim();
        }

        function repairJsonSource(text) {
            let output = '';
            let inString = false;
            let escaped = false;
            for (const char of text) {
                if (inString) {
                    if (!escaped && char === '"') inString = false;
                    if (!escaped && char === '\n') output += '\\n';
                    else if (!escaped && char === '\r') output += '\\r';
                    else if (!escaped && char === '\t') output += '\\t';
                    else output += char;
                    if (escaped) escaped = false;
                    else if (char === '\\') escaped = true;
                } else {
                    if (char === '"') inString = true;
                    output += char === '\u00a0' ? ' ' : char;
                }
            }
            return output.replace(/,\s*([}\]])/g, '$1');
        }

        function parseJsonValue(text) {
            const normalized = normalizeJsonSource(text);
            if (!normalized) throw new Error('JSON 内容为空');
            try {
                return JSON.parse(preserveLargeIntegers(normalized));
            } catch (strictError) {
                return JSON.parse(preserveLargeIntegers(repairJsonSource(normalized)));
            }
        }

        function decodeJsonLayers(value, maxDepth = 5) {
            let parsed = value;
            for (let i = 0; i < maxDepth && typeof parsed === 'string'; i++) {
                const trimmed = normalizeJsonSource(parsed);
                if (!trimmed || !/^[{[\"]/.test(trimmed)) break;
                parsed = parseJsonValue(trimmed);
            }
            return parsed;
        }

        function parseNestedJson(value) {
            try {
                const parsed = decodeJsonLayers(value);
                return parsed && typeof parsed === 'object' ? parsed : null;
            } catch (error) {
                return null;
            }
        }

        function getAuditLabel(result) {
            const normalized = String(result || '').toLowerCase();
            if (normalized === 'pass') return '通过';
            if (normalized === 'refuse') return '拒绝';
            return result ? String(result) : '未标注';
        }

        function getAuditClass(result) {
            const normalized = String(result || '').toLowerCase();
            return normalized === 'pass' || normalized === 'refuse' ? normalized : 'unknown';
        }

        function getFieldLabel(name) {
            const labels = {
                can_push: '是否可推',
                source_cn: '视频来源',
                push_manual_review: '人工审核',
                pc_status: 'PC 状态',
                video_create_time: '视频创建时间',
                author_nickname: '作者昵称',
                author_cert_info: '作者认证',
                material_audit_radio: '机审文案是否可推',
                regional_push: '区域推送',
                push_range: '推送范围',
                push_timeliness: '时效性',
                time_period: '时间周期',
                push_image: '封图操作',
                audit_source_category: '审核来源分类',
                user_type_input: '用户类型',
                use_region_code_recall: '使用区域召回',
                use_regional_push: '使用区域推送',
                aigc_num: 'AIGC 文案数',
                agent_label_res: 'Agent 标签结果',
                manual_audit_option: '人工审核选项',
                xg_manual_audit_option: '西瓜人工审核选项',
                refuse_reason: '拒绝原因',
                note: '备注',
                enqueue_type: '入队类型',
                material_info_map: '素材信息',
                modify_material_info_map: '修改后素材信息'
            };
            return labels[name] || name;
        }

        function formatBoolean(value) {
            if (value === true || String(value).toLowerCase() === 'true') return '是';
            if (value === false || String(value).toLowerCase() === 'false') return '否';
            return value === undefined || value === null || value === '' ? '未填写' : String(value);
        }

        function getRefuseReasonLabel(value) {
            const labels = {
                low_quality_content: '低质内容'
            };
            if (!value) return '未填写';
            return labels[value] ? `${labels[value]}（${value}）` : value;
        }

        function parseMaterialItems(fieldMap) {
            const originalMap = parseNestedJson(fieldMap.get('material_info_map')) || {};
            const modifiedMap = parseNestedJson(fieldMap.get('modify_material_info_map')) || {};
            const keys = new Set([...Object.keys(originalMap), ...Object.keys(modifiedMap)]);

            return Array.from(keys).map(mapKey => {
                const original = originalMap[mapKey] && typeof originalMap[mapKey] === 'object'
                    ? originalMap[mapKey]
                    : {};
                const modified = modifiedMap[mapKey] && typeof modifiedMap[mapKey] === 'object'
                    ? modifiedMap[mapKey]
                    : {};
                const hasModifiedEntry = Object.prototype.hasOwnProperty.call(modifiedMap, mapKey);
                return {
                    key: String(modified.key || original.key || mapKey),
                    value: String(modified.value ?? original.value ?? ''),
                    modifyOption: modified.modify_option ?? original.modify_option ?? '',
                    manualAuditStatus: modified.manual_audit_status ?? original.manual_audit_status ?? '',
                    originalManualAuditStatus: original.manual_audit_status ?? '',
                    hasModifiedEntry
                };
            });
        }

        function normalizeCandidate(item, index) {
            const isMultiText = item.type === 'multiText' || item.multi_text_title || item.multi_text_content;
            const title = isMultiText
                ? (item.multi_text_title || item.text || item.value || '')
                : (item.text || item.value || '');
            const content = isMultiText ? (item.multi_text_content || '') : '';
            const fullText = item.value || item.text || [title, content].filter(Boolean).join(' ');
            const extra = item.extra && typeof item.extra === 'object' ? item.extra : {};
            return {
                index,
                type: isMultiText ? '长文案' : '短文案',
                title: String(title),
                content: String(content),
                fullText: String(fullText),
                auditResult: String(item.audit_result || ''),
                genType: String(item.gen_type || ''),
                taskIds: Array.isArray(extra.aigc_task_id_list) ? extra.aigc_task_id_list.map(String) : [],
                corrections: Array.isArray(extra.correction_result) ? extra.correction_result.map(String) : []
            };
        }

        function flattenSubmissionFields(value, path = '', fields = [], depth = 0, maxDepth = 2) {
            if (depth >= maxDepth) {
                let displayValue = value;
                if (value && typeof value === 'object') {
                    try {
                        displayValue = JSON.stringify(value);
                    } catch (error) {
                        displayValue = String(value);
                    }
                }
                fields.push({
                    name: path,
                    value: displayValue === undefined || displayValue === null ? '' : String(displayValue)
                });
                return fields;
            }

            const nested = typeof value === 'string' && /^[{[]/.test(value.trim())
                ? parseNestedJson(value)
                : null;
            const current = nested || value;
            if (Array.isArray(current)) {
                if (current.length === 0) fields.push({ name: path, value: '[]' });
                current.forEach((item, index) => {
                    flattenSubmissionFields(item, `${path}[${index}]`, fields, depth + 1, maxDepth);
                });
            } else if (current && typeof current === 'object') {
                const entries = Object.entries(current);
                if (entries.length === 0) fields.push({ name: path, value: '{}' });
                entries.forEach(([key, item]) => {
                    flattenSubmissionFields(item, path ? `${path}.${key}` : key, fields, depth + 1, maxDepth);
                });
            } else {
                fields.push({
                    name: path,
                    value: current === undefined || current === null ? '' : String(current)
                });
            }
            return fields;
        }

        function parseSubmissionRecord(jsonObj) {
            const rawSubmission = jsonObj.DouyinSubmissionInfo;
            const submission = parseNestedJson(rawSubmission)
                || (rawSubmission && typeof rawSubmission === 'object' ? rawSubmission : {});
            const itemInfo = parseNestedJson(submission.ItemInfo) || {};
            const itemAttr = parseNestedJson(submission.ItemAttr) || {};
            const fuseLabels = parseNestedJson(itemAttr.fuse_video_labels_v2) || {};
            const topLabel = Array.isArray(fuseLabels.top_1) ? fuseLabels.top_1[0] : fuseLabels.top_1;
            const levelOne = topLabel?.level_1 && typeof topLabel.level_1 === 'object'
                ? topLabel.level_1
                : {};
            const expanded = { ...submission, ItemInfo: itemInfo, ItemAttr: itemAttr };
            const customContent = itemInfo.CustomContent || {};
            return {
                meta: { realAssignTime: '', realResolveTime: '', durationSeconds: null },
                summary: {
                    source: '抖音投稿信息',
                    author: submission.Userinfo?.NickName || '',
                    authorCert: String(submission.Userinfo?.OriginalCert ?? ''),
                    videoCreateTime: formatTimestamp(itemInfo.CreateTime),
                    canPush: '', pcStatus: '', timeliness: '', timePeriod: '', auditSource: '',
                    manualAuditOption: '', xgManualAuditOption: '', refuseReason: '', note: '', enqueueType: ''
                },
                recordType: 'douyin_submission',
                originText: customContent.text || customContent.item_title || customContent.caption || '',
                fuseVideoLabel: {
                    tagName: levelOne.tag_name ?? '',
                    tagId: levelOne.tag_id ?? '',
                    probability: levelOne.prob ?? ''
                },
                candidates: [],
                machineAudits: [],
                materialItems: [],
                details: flattenSubmissionFields(expanded, 'DouyinSubmissionInfo')
            };
        }

        function parseRecord(jsonObj) {
            if (!jsonObj || typeof jsonObj !== 'object' || Array.isArray(jsonObj)) {
                throw new Error('记录不是有效的 JSON 对象');
            }
            if (jsonObj.DouyinSubmissionInfo) return parseSubmissionRecord(jsonObj);
            const rawMainForm = parseNestedJson(jsonObj.mainForm) || jsonObj.mainForm;
            const mainForm = Array.isArray(rawMainForm) ? rawMainForm : [];
            const allFields = mainForm
                .filter(item => item && item.name && !shouldSkipField(item.name))
                .map(item => ({
                    name: String(item.name),
                    value: item.value !== undefined && item.value !== null ? String(item.value) : ''
                }));
            const fieldMap = new Map(allFields.map(field => [field.name, field.value]));
            const materialAudit = parseNestedJson(fieldMap.get('material_audit_res')) || {};
            const materialItems = parseMaterialItems(fieldMap);
            const nestedCandidates = Array.isArray(materialAudit.common_material_contents)
                ? materialAudit.common_material_contents
                : [];
            let candidates = nestedCandidates.map(normalizeCandidate);

            if (candidates.length === 0) {
                candidates = allFields
                    .filter(field => /^aigc_text_\d+$/.test(field.name))
                    .sort((a, b) => Number(a.name.split('_').pop()) - Number(b.name.split('_').pop()))
                    .map((field, index) => normalizeCandidate({
                        value: field.value,
                        audit_result: fieldMap.get(`aigc_text_audit_res_${index}`) || ''
                    }, index));
            }

            const machineAudits = Object.entries(materialAudit)
                .filter(([name, value]) => name !== 'common_material_contents' && Array.isArray(value))
                .flatMap(([group, items]) => items.map(item => ({
                    group,
                    name: String(item.name || item.strategy || group),
                    text: String(item.text || item.value || ''),
                    auditResult: String(item.audit_result || ''),
                    corrections: Array.isArray(item.extra?.correction_result)
                        ? item.extra.correction_result.map(String)
                        : []
                })));

            const candidateTexts = new Set(candidates.map(item => item.fullText));
            const primaryFields = new Set([
                'can_push', 'source_cn', 'origin_text', 'video_create_time',
                'author_nickname', 'author_cert_info', 'material_audit_res',
                'pc_status', 'push_timeliness', 'time_period',
                'manual_audit_option', 'xg_manual_audit_option', 'refuse_reason',
                'note', 'enqueue_type', 'material_info_map', 'modify_material_info_map'
            ]);
            const details = allFields.filter(field => {
                if (primaryFields.has(field.name)) return false;
                if (/^aigc_text(_audit_res)?_\d+$/.test(field.name)) return false;
                if (candidateTexts.has(field.name)) return false;
                return true;
            });

            const assignSeconds = Number(jsonObj.real_assign_time);
            const resolveSeconds = Number(jsonObj.real_resolve_time);
            const durationSeconds = Number.isFinite(assignSeconds) && Number.isFinite(resolveSeconds)
                ? Math.max(0, Math.round(resolveSeconds - assignSeconds))
                : null;

            return {
                meta: {
                    realAssignTime: formatTimestamp(jsonObj.real_assign_time),
                    realResolveTime: formatTimestamp(jsonObj.real_resolve_time),
                    durationSeconds
                },
                summary: {
                    source: fieldMap.get('source_cn') || '',
                    author: fieldMap.get('author_nickname') || '',
                    authorCert: fieldMap.get('author_cert_info') || '',
                    videoCreateTime: fieldMap.get('video_create_time') || '',
                    canPush: fieldMap.get('can_push') || '',
                    pcStatus: fieldMap.get('pc_status') || '',
                    timeliness: fieldMap.get('push_timeliness') || '',
                    timePeriod: fieldMap.get('time_period') || '',
                    auditSource: fieldMap.get('audit_source_category') || '',
                    manualAuditOption: fieldMap.get('manual_audit_option') || '',
                    xgManualAuditOption: fieldMap.get('xg_manual_audit_option') || '',
                    refuseReason: fieldMap.get('refuse_reason') || '',
                    note: fieldMap.get('note') || '',
                    enqueueType: fieldMap.get('enqueue_type') || ''
                },
                recordType: materialItems.length > 0 ? 'material_manual_audit' : 'aigc_audit',
                originText: fieldMap.get('origin_text') || materialItems[0]?.value || '',
                candidates,
                machineAudits,
                materialItems,
                details
            };
        }

        function formatDuration(seconds) {
            if (seconds === null) return '';
            if (seconds < 60) return `${seconds} 秒`;
            const minutes = Math.floor(seconds / 60);
            const remain = seconds % 60;
            return `${minutes} 分 ${remain} 秒`;
        }

        function parseJsonText(text) {
            const source = normalizeJsonSource(text);
            if (!source) return [];

            const records = [];
            let failedCount = 0;

            function appendValue(value) {
                const decoded = decodeJsonLayers(value);
                if (Array.isArray(decoded)) {
                    decoded.forEach(appendValue);
                    return;
                }
                if (!decoded || typeof decoded !== 'object') {
                    throw new Error('JSON 中没有可用记录');
                }
                const wrapper = ['records', 'items', 'list', 'data', 'result']
                    .find(key => decoded[key] && (Array.isArray(decoded[key]) || typeof decoded[key] === 'object'));
                if (!decoded.mainForm && !decoded.DouyinSubmissionInfo && wrapper) {
                    appendValue(decoded[wrapper]);
                    return;
                }
                records.push(parseRecord(decoded));
            }

            function tryCandidate(candidate) {
                try {
                    appendValue(parseJsonValue(candidate));
                    return true;
                } catch (error) {
                    failedCount++;
                    return false;
                }
            }

            if (!tryCandidate(source)) {
                const lines = source.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
                lines.forEach(candidate => tryCandidate(candidate));
                if (records.length === 0) {
                    splitJsonObjects(source).forEach(candidate => tryCandidate(candidate));
                }
            }

            if (records.length === 0) {
                throw new Error('无法解析输入内容，请确认 JSON 是否完整');
            }
            records.parseStats = { failedCount };
            return records;
        }

        async function parseJsonTextResponsive(text, onProgress) {
            const source = normalizeJsonSource(text);
            const lines = source.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
            const jsonLineCount = lines.reduce((count, line) => {
                return count + (/^[{[]/.test(line) && /[}\]]$/.test(line) ? 1 : 0);
            }, 0);
            if (lines.length < 50 || jsonLineCount < lines.length * 0.8) {
                return parseJsonText(source);
            }

            const records = [];
            let failedCount = 0;
            const batchSize = 25;
            for (let index = 0; index < lines.length; index++) {
                try {
                    const lineRecords = parseJsonText(lines[index]);
                    failedCount += lineRecords.parseStats?.failedCount || 0;
                    records.push(...lineRecords);
                } catch (error) {
                    failedCount++;
                }
                if ((index + 1) % batchSize === 0) {
                    onProgress?.(index + 1, lines.length, records.length);
                    await new Promise(resolve => setTimeout(resolve, 0));
                }
            }
            if (records.length === 0) return parseJsonText(source);
            records.parseStats = { failedCount };
            return records;
        }

        function splitJsonObjects(text) {
            const chunks = [];
            let start = -1;
            let depth = 0;
            let inString = false;
            let escaped = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (inString) {
                    if (escaped) {
                        escaped = false;
                    } else if (char === '\\') {
                        escaped = true;
                    } else if (char === '"') {
                        inString = false;
                    }
                    continue;
                }
                if (char === '"') {
                    inString = true;
                    continue;
                }
                if (char === '{' || char === '[') {
                    if (depth === 0) start = i;
                    depth++;
                } else if (char === '}' || char === ']') {
                    depth--;
                    if (depth === 0 && start !== -1) {
                        chunks.push(text.slice(start, i + 1));
                        start = -1;
                    }
                }
            }
            return chunks;
        }

        function getPushStatus(summary) {
            const canPush = String(
                summary.canPush || summary.manualAuditOption || summary.xgManualAuditOption || ''
            ).trim().toLowerCase();
            const pcStatus = String(summary.pcStatus || '').trim().toLowerCase();
            if (canPush === 'pc' || ['yes', '是', 'true', '1', 'pc'].includes(pcStatus)) return 'pc';
            if (['是', 'yes', 'true', '1', 'pass'].includes(canPush)) return 'yes';
            if (['否', 'no', 'false', '0', 'refuse'].includes(canPush)) return 'no';
            return '';
        }

        function renderResults(records) {
            parsedRecords = records;
            currentRecordIndex = 0;
            if (records.length === 0) {
                resultsContainer.innerHTML = '<div class="empty-state"><p>未解析到任何记录</p></div>';
                resultsSection.style.display = 'block';
                resultsCount.textContent = '';
                pageIndicator.textContent = '0 / 0';
                previousCaseBtn.disabled = true;
                nextCaseBtn.disabled = true;
                return;
            }

            resultsCount.textContent = `共解析 ${records.length} 条记录`;
            resultsSection.style.display = 'block';
            refreshExportFields();
            renderCurrentRecord();
        }

        function renderCurrentRecord() {
            const record = parsedRecords[currentRecordIndex];
            if (!record) return;

            const isMaterialAudit = record.recordType === 'material_manual_audit';
            const isSubmission = record.recordType === 'douyin_submission';
            const pushStatus = getPushStatus(record.summary);
            const author = [record.summary.author, record.summary.authorCert].filter(value => value !== '').join(' / ');
            const source = record.summary.source || (isMaterialAudit ? '素材人工审核' : '来源未填写');
            const timeParts = [];
            if (record.summary.videoCreateTime) timeParts.push(`视频：${record.summary.videoCreateTime}`);
            if (record.meta.realAssignTime) timeParts.push(`分配：${record.meta.realAssignTime}`);
            if (record.meta.realResolveTime) timeParts.push(`完成：${record.meta.realResolveTime}`);
            if (record.meta.durationSeconds !== null) timeParts.push(`耗时：${formatDuration(record.meta.durationSeconds)}`);

            let html = '<div class="record-card">';
            html += '<header class="record-header">';
            html += '<div class="record-identity">';
            html += '<div class="record-source-line">';
            html += `<span class="record-number">Case ${currentRecordIndex + 1}</span>`;
            html += `<span class="record-source">${escapeHtml(source)}</span>`;
            html += '</div>';
            if (author) {
                html += `<div class="record-info-line"><strong>作者：</strong>${escapeHtml(author)}</div>`;
            }
            html += `<div class="record-info-line"><strong>时间：</strong>${escapeHtml(timeParts.join('　') || '未填写')}</div>`;
            html += '</div>';
            if (!isSubmission) {
                html += '<div class="push-status-panel" aria-label="是否可推">';
                html += `<div class="push-status-option yes ${pushStatus === 'yes' ? 'active' : ''}"><strong>是</strong><small>可推</small></div>`;
                html += `<div class="push-status-option pc ${pushStatus === 'pc' ? 'active' : ''}"><strong>PC</strong><small>转 PC</small></div>`;
                html += `<div class="push-status-option no ${pushStatus === 'no' ? 'active' : ''}"><strong>否</strong><small>不可推</small></div>`;
                html += '</div>';
            }
            html += '</header>';

            if (isSubmission) {
                const detailMap = new Map(record.details.map(field => [field.name, field.value]));
                const fuseLabel = record.fuseVideoLabel || {};
                const highlightedFields = [
                    ['tag_name', fuseLabel.tagName],
                    ['tag_id', fuseLabel.tagId],
                    ['prob', fuseLabel.probability]
                ];
                html += '<section class="fuse-label-summary" aria-label="一级融合视频标签">';
                highlightedFields.forEach(([name, value]) => {
                    const displayValue = value === '' || value === null || value === undefined ? '未填写' : String(value);
                    html += '<div class="fuse-label-item">';
                    html += `<span class="fuse-label-key">${escapeHtml(name)}</span>`;
                    html += `<span class="fuse-label-value">${escapeHtml(displayValue)}</span>`;
                    html += '</div>';
                });
                html += '</section>';
                const facts = [
                    `作品 ID：${detailMap.get('DouyinSubmissionInfo.ItemID') || detailMap.get('DouyinSubmissionInfo.ItemInfo.Id') || '未填写'}`,
                    `用户 ID：${detailMap.get('DouyinSubmissionInfo.ItemInfo.UserId') || '未填写'}`,
                    `媒体类型：${detailMap.get('DouyinSubmissionInfo.ItemInfo.MediaType') || '未填写'}`
                ];
                html += `<div class="timeliness-line">${escapeHtml(facts.join('　｜　'))}</div>`;
                html += '<section class="record-block">';
                html += '<h3 class="block-title">投稿原文</h3>';
                html += `<div class="origin-text">${escapeHtml(record.originText || '未填写')}</div>`;
                html += '</section>';
            } else if (isMaterialAudit) {
                const auditFacts = [
                    `人工审核：${record.summary.manualAuditOption || '未填写'}`,
                    `西瓜人工审核：${record.summary.xgManualAuditOption || '未填写'}`,
                    `拒绝原因：${getRefuseReasonLabel(record.summary.refuseReason)}`,
                    `入队类型：${record.summary.enqueueType || '未填写'}`
                ];
                if (record.summary.note) auditFacts.push(`备注：${record.summary.note}`);
                html += `<div class="timeliness-line">${escapeHtml(auditFacts.join('　｜　'))}</div>`;
                html += '<section class="record-block">';
                html += `<h3 class="block-title">审核素材（${record.materialItems.length} 项）</h3>`;
                html += '<div class="material-review-list">';
                record.materialItems.forEach(item => {
                    const formattedStatus = formatBoolean(item.manualAuditStatus);
                    const statusClass = formattedStatus === '是'
                        ? 'pass'
                        : (formattedStatus === '否' ? 'refuse' : 'unknown');
                    const meta = [
                        `修改选项：${item.modifyOption === '' ? '未填写' : item.modifyOption}`,
                        `人工审核状态：${formatBoolean(item.manualAuditStatus)}`
                    ];
                    if (item.hasModifiedEntry) {
                        meta.push(`原始审核状态：${formatBoolean(item.originalManualAuditStatus)}`);
                    }
                    html += '<article class="material-review-item">';
                    html += '<div class="material-review-head">';
                    html += `<span class="material-key">${escapeHtml(item.key)}</span>`;
                    html += `<span class="audit-badge ${statusClass}">${escapeHtml(formattedStatus)}</span>`;
                    html += '</div>';
                    html += `<div class="material-value">${escapeHtml(item.value || '未填写')}</div>`;
                    html += `<div class="material-meta">${meta.map(value => `<span>${escapeHtml(value)}</span>`).join('')}</div>`;
                    html += '</article>';
                });
                html += '</div></section>';
            } else {
                html += `<div class="timeliness-line">时效性：${escapeHtml(record.summary.timeliness || '未填写')}　｜　时间周期：${escapeHtml(record.summary.timePeriod || '未填写')}</div>`;
                html += '<section class="record-block review-context">';
                html += '<div class="review-context-column">';
                html += '<h3 class="block-title">原始标题 / 文案</h3>';
                html += `<div class="origin-text">${escapeHtml(record.originText || '未填写')}</div>`;
                html += '</div>';
                html += '<div class="review-context-column">';
                html += `<h3 class="block-title">机审结果（${record.machineAudits.length} 条）</h3>`;
                if (record.machineAudits.length > 0) {
                    html += '<div class="machine-audit">';
                    record.machineAudits.forEach(item => {
                        const auditClass = getAuditClass(item.auditResult);
                        const correctionText = item.corrections.length ? `纠错：${item.corrections.join('、')}` : '';
                        html += '<div class="machine-audit-item"><div>';
                        html += `<span class="machine-name">${escapeHtml(item.name)}</span>`;
                        html += `<span class="machine-text">${escapeHtml(item.text)}</span>`;
                        if (correctionText) html += `<div class="candidate-meta">${escapeHtml(correctionText)}</div>`;
                        html += '</div>';
                        html += `<span class="audit-badge ${auditClass}">${escapeHtml(getAuditLabel(item.auditResult))}</span>`;
                        html += '</div>';
                    });
                    html += '</div>';
                } else {
                    html += '<div class="candidate-meta">无机审结果</div>';
                }
                html += '</div></section>';

                html += '<section class="record-block">';
                html += `<h3 class="block-title">AIGC 候选文案（${record.candidates.length} 条）</h3>`;
                if (record.candidates.length > 0) {
                    html += '<div class="candidate-list">';
                    record.candidates.forEach((candidate, candidateIndex) => {
                        const auditClass = getAuditClass(candidate.auditResult);
                        const textLength = candidate.fullText.replace(/\s/g, '').length;
                        html += '<article class="candidate-card">';
                        html += '<div class="candidate-topline">';
                        html += `<span class="candidate-index">AI 文案 ${candidateIndex + 1} · ${textLength} 字 · ${candidate.type}</span>`;
                        html += `<span class="audit-badge ${auditClass}">${escapeHtml(getAuditLabel(candidate.auditResult))}</span>`;
                        html += '</div>';
                        html += `<div class="candidate-title">${escapeHtml(candidate.title || candidate.fullText)}</div>`;
                        if (candidate.content) html += `<div class="candidate-content">${escapeHtml(candidate.content)}</div>`;
                        const metaParts = [];
                        if (candidate.genType) metaParts.push(`类型：${candidate.genType}`);
                        if (candidate.taskIds.length) metaParts.push(`任务：${candidate.taskIds.join('、')}`);
                        if (candidate.corrections.length) metaParts.push(`纠错：${candidate.corrections.join('、')}`);
                        if (metaParts.length) {
                            html += `<div class="candidate-footer"><span class="candidate-meta">${escapeHtml(metaParts.join(' · '))}</span></div>`;
                        }
                        html += '</article>';
                    });
                    html += '</div>';
                } else {
                    html += '<div class="candidate-meta">未找到 AIGC 候选文案</div>';
                }
                html += '</section>';
            }

            if (record.details.length > 0) {
                html += '<section class="record-block">';
                html += `<details class="details-toggle"><summary>${isSubmission ? '全部投稿字段' : '其他审核字段'}</summary>`;
                html += '<table class="field-table">';
                record.details.forEach(field => {
                    const displayValue = field.value === '' ? '未填写' : field.value;
                    html += '<tr>';
                    html += `<td class="field-name">${escapeHtml(getFieldLabel(field.name))}</td>`;
                    html += `<td class="field-value ${field.value === '' ? 'empty' : ''}">${escapeHtml(displayValue)}</td>`;
                    html += '</tr>';
                });
                html += '</table></details></section>';
            }
            html += '</div>';

            resultsContainer.innerHTML = html;
            pageIndicator.textContent = `${currentRecordIndex + 1} / ${parsedRecords.length}`;
            previousCaseBtn.disabled = currentRecordIndex === 0;
            nextCaseBtn.disabled = currentRecordIndex === parsedRecords.length - 1;
        }

        function changeCase(offset) {
            const now = Date.now();
            if (now - lastCaseNavigationAt < 250) return;
            lastCaseNavigationAt = now;
            const nextIndex = Math.min(
                parsedRecords.length - 1,
                Math.max(0, currentRecordIndex + offset)
            );
            if (nextIndex === currentRecordIndex) return;
            currentRecordIndex = nextIndex;
            renderCurrentRecord();
            resultsSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        async function handleTextParse() {
            const input = document.getElementById('jsonInput').value;
            const status = document.getElementById('textParseStatus');
            if (!input.trim()) {
                status.textContent = '请先粘贴 JSON 文本';
                return;
            }
            status.textContent = '正在解析...';
            status.style.color = 'var(--muted)';
            await new Promise(resolve => requestAnimationFrame(resolve));
            try {
                const records = await parseJsonTextResponsive(input, (processed, total, success) => {
                    status.textContent = `正在解析 ${processed} / ${total}，已成功 ${success} 条`;
                });
                const recoveredCount = records.parseStats?.failedCount || 0;
                renderResults(records);
                status.textContent = `成功解析 ${records.length} 条记录`
                    + (recoveredCount ? `，已容错跳过 ${recoveredCount} 个异常片段` : '');
                status.style.color = recoveredCount ? 'var(--orange, #d97706)' : 'var(--green)';
            } catch (e) {
                status.textContent = '解析失败：' + e.message;
                status.style.color = 'var(--red)';
                resultsSection.style.display = 'none';
            }
        }

        function handleFileParse() {
            const fileInput = document.getElementById('fileInput');
            const status = document.getElementById('fileParseStatus');
            const file = fileInput.files[0];
            if (!file) {
                status.textContent = '请先选择文件';
                return;
            }

            status.textContent = '正在解析...';
            status.style.color = 'var(--muted)';

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    let sourceRows = null;
                    let headerRowIndex = -1;
                    let colIndex = -1;
                    let sourceSheetName = '';

                    for (const sheetName of workbook.SheetNames) {
                        const rows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], {
                            header: 1,
                            raw: false,
                            defval: ''
                        });
                        for (let rowIndex = 0; rowIndex < Math.min(rows.length, 30); rowIndex++) {
                            const foundIndex = rows[rowIndex].findIndex(cell =>
                                String(cell || '').trim() === '1_审核记录'
                            );
                            if (foundIndex !== -1) {
                                sourceRows = rows;
                                headerRowIndex = rowIndex;
                                colIndex = foundIndex;
                                sourceSheetName = sheetName;
                                break;
                            }
                        }
                        if (colIndex !== -1) break;
                    }

                    if (colIndex === -1) {
                        status.textContent = '所有工作表前 30 行均未找到【1_审核记录】列';
                        status.style.color = 'var(--red)';
                        return;
                    }

                    const allRecords = [];
                    let failedCount = 0;
                    let recoveredCount = 0;
                    for (let r = headerRowIndex + 1; r < sourceRows.length; r++) {
                        const cell = sourceRows[r][colIndex];
                        if (cell && String(cell).trim()) {
                            const cellText = String(cell).trim();
                            try {
                                const records = parseJsonText(cellText);
                                recoveredCount += records.parseStats?.failedCount || 0;
                                allRecords.push(...records);
                            } catch (e2) {
                                failedCount++;
                            }
                        }
                        if ((r - headerRowIndex) % 25 === 0) {
                            status.textContent = `正在解析第 ${r - headerRowIndex} / ${sourceRows.length - headerRowIndex - 1} 行，已成功 ${allRecords.length} 条`;
                            await new Promise(resolve => setTimeout(resolve, 0));
                        }
                    }

                    if (allRecords.length === 0) {
                        status.textContent = '未解析到有效记录';
                        status.style.color = 'var(--red)';
                        return;
                    }

                    renderResults(allRecords);
                    status.textContent = `工作表「${sourceSheetName}」成功解析 ${allRecords.length} 条记录`
                        + (failedCount ? `，${failedCount} 个单元格失败` : '')
                        + (recoveredCount ? `，容错跳过 ${recoveredCount} 个异常片段` : '');
                    status.style.color = failedCount || recoveredCount ? 'var(--orange, #d97706)' : 'var(--green)';
                } catch (e) {
                    status.textContent = '文件解析失败：' + e.message;
                    status.style.color = 'var(--red)';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function buildExportRows(applySelection = true, sourceRecords = parsedRecords) {
            const labelFields = ['tag_name', 'tag_id', 'prob'];
            const fastLabelExport = applySelection
                && selectedExportFields.size > 0
                && [...selectedExportFields].every(field => labelFields.includes(field));
            const rows = sourceRecords.map((record, index) => {
                const fuseLabel = record.fuseVideoLabel || {};
                if (fastLabelExport) {
                    const labelRow = {
                        tag_name: fuseLabel.tagName ?? '',
                        tag_id: fuseLabel.tagId ?? '',
                        prob: fuseLabel.probability ?? ''
                    };
                    return Object.fromEntries(
                        Object.entries(labelRow).filter(([name]) => selectedExportFields.has(name))
                    );
                }
                const row = {
                    ...(record.recordType === 'douyin_submission' ? {
                        tag_name: fuseLabel.tagName ?? '',
                        tag_id: fuseLabel.tagId ?? '',
                        prob: fuseLabel.probability ?? ''
                    } : {}),
                    '记录编号': index + 1,
                    '记录类型': record.recordType === 'material_manual_audit'
                        ? '素材人工审核'
                        : (record.recordType === 'douyin_submission' ? '抖音投稿信息' : 'AIGC 审核'),
                    '分配时间': record.meta.realAssignTime,
                    '完成时间': record.meta.realResolveTime,
                    '审核耗时': formatDuration(record.meta.durationSeconds),
                    '视频来源': record.summary.source || (record.recordType === 'material_manual_audit' ? '素材人工审核' : ''),
                    '作者昵称': record.summary.author,
                    '作者认证': record.summary.authorCert,
                    '视频创建时间': record.summary.videoCreateTime,
                    '是否可推': record.summary.canPush || record.summary.manualAuditOption || record.summary.xgManualAuditOption,
                    'PC 状态': record.summary.pcStatus,
                    '时效性': record.summary.timeliness,
                    '时间周期': record.summary.timePeriod,
                    '审核来源分类': record.summary.auditSource,
                    '人工审核选项': record.summary.manualAuditOption,
                    '西瓜人工审核选项': record.summary.xgManualAuditOption,
                    '拒绝原因': getRefuseReasonLabel(record.summary.refuseReason),
                    '备注': record.summary.note,
                    '入队类型': record.summary.enqueueType,
                    '原始标题/文案': record.originText
                };

                record.materialItems.forEach((item, materialIndex) => {
                    const prefix = `审核素材${materialIndex + 1}`;
                    row[`${prefix}_字段`] = item.key;
                    row[`${prefix}_内容`] = item.value;
                    row[`${prefix}_修改选项`] = item.modifyOption;
                    row[`${prefix}_人工审核状态`] = formatBoolean(item.manualAuditStatus);
                    row[`${prefix}_原始审核状态`] = formatBoolean(item.originalManualAuditStatus);
                });

                record.candidates.forEach((candidate, candidateIndex) => {
                    const prefix = `AI文案${candidateIndex + 1}`;
                    row[`${prefix}_类型`] = candidate.type;
                    row[`${prefix}_标题`] = candidate.title;
                    row[`${prefix}_正文`] = candidate.content;
                    row[`${prefix}_完整文案`] = candidate.fullText;
                    row[`${prefix}_审核结果`] = getAuditLabel(candidate.auditResult);
                    row[`${prefix}_任务ID`] = candidate.taskIds.join('、');
                    row[`${prefix}_纠错结果`] = candidate.corrections.join('、');
                });

                record.machineAudits.forEach((item, auditIndex) => {
                    const prefix = `机审${auditIndex + 1}`;
                    row[`${prefix}_规则`] = item.name;
                    row[`${prefix}_内容`] = item.text;
                    row[`${prefix}_结果`] = getAuditLabel(item.auditResult);
                    row[`${prefix}_纠错结果`] = item.corrections.join('、');
                });

                record.details.forEach(field => {
                    row[getFieldLabel(field.name)] = field.value;
                });
                return row;
            });
            if (!applySelection) return rows;
            return rows.map(row => Object.fromEntries(
                Object.entries(row).filter(([name]) => selectedExportFields.has(name))
            ));
        }

        function refreshExportFields() {
            const submissionDefaults = ['tag_name', 'tag_id', 'prob'];
            const onlySubmissions = parsedRecords.length > 0
                && parsedRecords.every(record => record.recordType === 'douyin_submission');
            const fieldSource = onlySubmissions ? parsedRecords.slice(0, 1) : parsedRecords;
            const rows = buildExportRows(false, fieldSource);
            const fields = Array.from(new Set(rows.flatMap(row => Object.keys(row))));
            selectedExportFields = new Set(onlySubmissions ? submissionDefaults : fields);
            exportFieldList.replaceChildren(...fields.map(field => {
                const label = document.createElement('label');
                label.className = 'field-picker-option';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.value = field;
                checkbox.checked = selectedExportFields.has(field);
                const text = document.createElement('span');
                text.textContent = field;
                label.append(checkbox, text);
                return label;
            }));
        }

        function setAllExportFields(checked) {
            exportFieldList.querySelectorAll('input[type="checkbox"]').forEach(checkbox => {
                checkbox.checked = checked;
                if (checked) selectedExportFields.add(checkbox.value);
                else selectedExportFields.delete(checkbox.value);
            });
        }

        function getSelectedRows() {
            if (selectedExportFields.size === 0) {
                showToast('请至少选择一个导出字段');
                return null;
            }
            return buildExportRows();
        }

        function exportExcel() {
            if (parsedRecords.length === 0) {
                showToast('无数据可导出');
                return;
            }

            const rows = getSelectedRows();
            if (!rows) return;
            const worksheet = XLSX.utils.json_to_sheet(rows);
            worksheet['!cols'] = Object.keys(rows[0]).map(key => ({
                wch: /文案|内容|标题/.test(key) ? 42 : 18
            }));
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, 'TCS解析结果');
            XLSX.writeFile(workbook, `tcs_parse_${new Date().toISOString().slice(0, 10)}.xlsx`);
            showToast('Excel 文件已下载');
        }

        function copyResult() {
            if (parsedRecords.length === 0) {
                showToast('无数据可复制');
                return;
            }

            const rows = getSelectedRows();
            if (!rows) return Promise.resolve(false);
            const headers = Array.from(new Set(rows.flatMap(row => Object.keys(row))));
            const tsv = [
                headers.join('\t'),
                ...rows.map(row => headers.map(header => String(row[header] ?? '').replace(/\t|\r?\n/g, ' ')).join('\t'))
            ].join('\n');

            return navigator.clipboard.writeText(tsv).then(() => {
                showToast('已复制到剪贴板');
                return true;
            }).catch(() => {
                showToast('复制失败，请手动选择');
                return false;
            });
        }

        async function openFeishuSheet() {
            const copied = await copyResult();
            if (copied) {
                window.open('https://bytedance.larkoffice.com/sheets/X3lzs3LKOhsJ1Bth11Cc7wXvndf', '_blank');
            }
        }

        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
                btn.classList.add('active');
                document.getElementById(btn.dataset.tab === 'text' ? 'textPanel' : 'filePanel').classList.add('active');
            });
        });

        // File input
        document.getElementById('fileInput').addEventListener('change', () => {
            const file = document.getElementById('fileInput').files[0];
            const label = document.getElementById('fileLabel');
            const labelText = document.getElementById('fileLabelText');
            const nameSpan = document.getElementById('fileName');
            if (file) {
                label.classList.add('has-file');
                labelText.textContent = '已选择文件';
                nameSpan.textContent = file.name;
            } else {
                label.classList.remove('has-file');
                labelText.textContent = '选择 Excel 文件';
                nameSpan.textContent = '';
            }
        });

        document.getElementById('textParseBtn').addEventListener('click', handleTextParse);
        document.getElementById('fileParseBtn').addEventListener('click', handleFileParse);
        document.getElementById('exportExcelBtn').addEventListener('click', exportExcel);
        document.getElementById('copyResultBtn').addEventListener('click', copyResult);
        document.getElementById('feishuSheetBtn').addEventListener('click', openFeishuSheet);
        document.getElementById('selectAllFieldsBtn').addEventListener('click', () => setAllExportFields(true));
        document.getElementById('clearAllFieldsBtn').addEventListener('click', () => setAllExportFields(false));
        exportFieldList.addEventListener('change', event => {
            if (!event.target.matches('input[type="checkbox"]')) return;
            if (event.target.checked) selectedExportFields.add(event.target.value);
            else selectedExportFields.delete(event.target.value);
        });
        previousCaseBtn.addEventListener('click', () => changeCase(-1));
        nextCaseBtn.addEventListener('click', () => changeCase(1));

        document.getElementById('jsonInput').addEventListener('keydown', (e) => {
            if (e.ctrlKey && e.key === 'Enter') {
                handleTextParse();
            }
        });

        document.addEventListener('keydown', (event) => {
            if (resultsSection.style.display === 'none') return;
            const tagName = event.target.tagName;
            if (tagName === 'INPUT' || tagName === 'TEXTAREA' || tagName === 'SELECT') return;
            if (event.key === 'ArrowLeft' || event.key === 'PageUp') {
                event.preventDefault();
                changeCase(-1);
            }
            if (event.key === 'ArrowRight' || event.key === 'PageDown') {
                event.preventDefault();
                changeCase(1);
            }
        });
    </script>
</body>
</html>
