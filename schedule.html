<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动排班 - 带班首页</title>
    <link rel="stylesheet" href="recent-updates.css?v=20260727-1">
    <script src="recent-updates.js?v=20260724-2" defer></script>
    <link rel="stylesheet" href="schedule.css?v=20260922-1">
</head>
<body>
    <main class="page">
        <button class="recent-updates-button" type="button" title="查看最近更新说明">最近更新</button>
        <div class="topbar">
            <a class="back-link" href="home.html">返回带班首页</a>
        </div>

        <section class="hero">
            <div>
                <!-- <div class="eyebrow">可用功能 · 自动排班</div> -->
                <h1>自动排班</h1>
                <p class="hero-desc" id="rangeText">正在生成排班周期...</p>
            </div>
            <div class="hero-actions">
                <div class="toolbar">
                    <button class="btn primary" type="button" id="solveBtn">本地排班</button>
                    <button class="btn ghost" type="button" id="aiSolveBtn">AI 排班</button>
                    <a class="btn ghost ai-login-link" id="scheduleAiLoginLink" target="_blank" rel="noopener noreferrer" hidden>登录 AI 服务</a>
                    <button class="btn ghost" type="button" id="clearBtn">清空排班</button>
                </div>
            </div>
        </section>

        <section class="panel staffing-panel">
            <div class="panel-header">
                <div>
                    <h2 class="panel-title">人力策略</h2>
                    <p class="muted">设置每日最低在班人数；指定日期覆盖星期策略，星期策略覆盖默认值，空白字段自动继承。</p>
                </div>
            </div>
            <div class="panel-body">
                <div class="staffing-grid">
                    <div class="staffing-section">
                        <h3 class="staffing-section-title">每日默认人数</h3>
                        <div class="staffing-fields">
                            <div class="staffing-field">
                                <label for="baseTotalInput">总人数最低</label>
                                <input class="staffing-input" id="baseTotalInput" type="number" min="0" max="300" step="1">
                            </div>
                            <div class="staffing-field">
                                <label for="baseMorningInput">早班最低</label>
                                <input class="staffing-input" id="baseMorningInput" type="number" min="0" max="300" step="1">
                            </div>
                            <div class="staffing-field">
                                <label for="baseNightInput">晚班最低</label>
                                <input class="staffing-input" id="baseNightInput" type="number" min="0" max="300" step="1">
                            </div>
                        </div>
                        <h3 class="staffing-section-title">星期与指定日期策略</h3>
                        <div class="strategy-editor">
                            <div class="staffing-field">
                                <label for="strategyTypeSelect">匹配方式</label>
                                <select class="staffing-select" id="strategyTypeSelect">
                                    <option value="dates">指定日期</option>
                                    <option value="weekday">每周星期</option>
                                </select>
                            </div>
                            <div class="staffing-field">
                                <label for="strategyTotalInput">总人数最低</label>
                                <input class="staffing-input" id="strategyTotalInput" type="number" min="0" max="300" step="1" placeholder="继承">
                            </div>
                            <div class="staffing-field">
                                <label for="strategyMorningInput">早班最低</label>
                                <input class="staffing-input" id="strategyMorningInput" type="number" min="0" max="300" step="1" placeholder="继承">
                            </div>
                            <div class="staffing-field">
                                <label for="strategyNightInput">晚班最低</label>
                                <input class="staffing-input" id="strategyNightInput" type="number" min="0" max="300" step="1" placeholder="继承">
                            </div>
                            <div class="strategy-editor-actions">
                                <button class="btn primary" type="button" id="addStrategyBtn">保存策略</button>
                                <button class="btn ghost" type="button" id="openStrategyPreviewBtn">策略预览</button>
                                <button class="btn ghost" type="button" id="cancelStrategyEditBtn" hidden>取消</button>
                            </div>
                            <div class="strategy-target-picker" id="strategyTargetPicker" aria-label="策略匹配范围"></div>
                        </div>
                        <div class="strategy-list" id="strategyList"></div>
                    </div>
                </div>
            </div>
        </section>

        <div class="layout">
            <section class="panel">
                <div class="panel-header">
                    <div>
                        <h2 class="panel-title" id="calendarTitle">日历排班</h2>
                        <p class="muted">点击已排班人员标签，可选择固定状态或删除该安排。</p>
                    </div>
                    <div class="calendar-actions">
                        <button class="calendar-export-btn" type="button" id="exportScheduleTextBtn">导出</button>
                        <div class="view-switch" role="group" aria-label="日历视图">
                            <button class="view-switch-option active" type="button" id="shiftViewBtn">班次</button>
                            <button class="view-switch-option" type="button" id="personViewBtn">人员</button>
                        </div>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="calendar-wrap" id="calendarWrap"></div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <div>
                        <h2 class="panel-title">人员列表</h2>
                        <p class="muted">点击人员卡片展开选择；点击班次后选择日期，会实时固定到日历和人员卡片中。</p>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="people-list" id="peopleList"></div>
                    <div class="toolbar" style="justify-content: flex-start; margin-top: 12px;">
                        <button class="btn ghost" type="button" id="addPersonBtn">新增人员</button>
                        <button class="btn ghost" type="button" id="removePersonBtn">删除当前人员</button>
                    </div>
                </div>
            </section>

            <section class="panel">
                <div class="panel-header">
                    <div>
                        <h2 class="panel-title">候选排班</h2>
                        <p class="muted">自动求解后最多展示 10 个候选方案。</p>
                    <p class="ai-solve-status" id="aiSolveStatus" aria-live="polite"></p>
                    </div>
                </div>
                <div class="panel-body">
                    <div class="solution-list" id="solutionList"></div>
                </div>
            </section>
        </div>

        <div class="archive-actions">
            <button class="btn ghost" type="button" id="exportArchiveBtn">存档到本地</button>
            <button class="btn ghost" type="button" id="importArchiveBtn">从本地导入</button>
            <input class="archive-input" type="file" id="archiveFileInput" accept=".json,application/json">
        </div>
    </main>

    <dialog class="strategy-preview-dialog" id="strategyPreviewDialog" aria-labelledby="strategyPreviewTitle">
        <div class="strategy-preview-page">
            <div class="strategy-preview-header">
                <div>
                    <h2 id="strategyPreviewTitle">策略预览</h2>
                    <p>当前周期各日期最终生效的人力配置</p>
                </div>
                <button class="strategy-preview-close" type="button" id="closeStrategyPreviewBtn" aria-label="关闭策略预览">×</button>
            </div>
            <div class="strategy-preview-content" id="strategyPreview"></div>
            <div class="strategy-preview-footer">
                <button class="btn primary" type="button" id="returnFromStrategyPreviewBtn">返回设置</button>
            </div>
        </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="app-config.js?v=20260922-1"></script>
    <script src="schedule.js?v=20260922-1"></script>
</body>
</html>
