<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拆词加词助手</title>
    <link rel="stylesheet" href="recent-updates.css?v=20260727-1">
    <script src="recent-updates.js?v=20260724-2" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="index.css?v=20260803-3">
</head>
<body>
    <div class="container">
        <button class="recent-updates-button" type="button" title="查看最近更新说明">最近更新</button>
        <div class="tool-header">
            <a class="home-link" href="home.html">← 返回带班首页</a>
            <h1>拆词加词助手</h1>
            <p class="tool-subtitle">用于快速组合拆词、单独补充词组，并在导出前集中确认和调整结果。</p>
        </div>
        <div class="quick-rescan-panel">
            <input class="quick-rescan-input" id="quickRescanInput" type="text" placeholder="快捷回扫：输入GID或素材值,多个素材值可用逗号/空格/分号分隔">
            <div class="quick-rescan-actions">
                <label class="quick-rescan-manual">
                    <input id="quickRescanManual" type="checkbox">
                    人审
                </label>
                <label class="quick-rescan-manual">
                    <input id="quickRescanAigc" type="checkbox">
                    AIGC
                </label>
                <button class="quick-rescan-option" type="button" id="quickScanGidBtn">扫GID</button>
                <button class="quick-rescan-option" type="button" id="quickScanMaterialBtn">扫素材</button>
                <span class="quick-rescan-status" id="quickRescanStatus" aria-live="polite"></span>
            </div>
        </div>
        <section class="ai-generator" aria-labelledby="aiGeneratorTitle">
            <div class="ai-generator-header">
                <div>
                    <h2 class="ai-generator-title" id="aiGeneratorTitle">AI 联网拆词</h2>
                    <p class="ai-generator-desc">输入新闻标题或正文，将检索近一个月相关内容，提取关键词及同近义扩展，供勾选后加入组合列或单独添加。</p>
                </div>
            </div>
            <div class="ai-generator-grid">
                <textarea class="news-source-input" id="newsSourceInput" placeholder="请输入一句话事件线索或粘贴完整新闻原文；建议至少包含地点、主体、机构、品牌、产品或事件名称中的两项"></textarea>
                <div class="ai-generator-actions">
                    <button class="copy-btn ai-generate-btn" id="aiGenerateBtn" type="button">联网生成关键词</button>
                    <span class="ai-generator-status" id="aiGeneratorStatus" aria-live="polite"></span>
                </div>
            </div>
        </section>
        <section class="ai-candidates" id="aiCandidates" aria-labelledby="aiCandidatesTitle">
            <div class="ai-generator-header">
                <div>
                    <h2 class="ai-generator-title" id="aiCandidatesTitle">AI 关键词候选</h2>
                    <p class="ai-generator-desc" id="candidateSummary">候选按主体、事件、地点、关键动作分类，并按证据与相关性分档。</p>
                </div>
            </div>
            <div id="candidateTiers"></div>
            <div class="candidate-footer">
                <span class="ai-generator-status" id="candidateActionStatus" aria-live="polite"></span>
            </div>
        </section>
        <div class="top-actions">
            <button class="add-column-btn" id="addColumnBtn">点击新增一列</button>
        </div>
        
        <div class="columns-wrapper" id="columnsWrapper">
            <div class="column" data-column-index="0">
                <div class="column-header">
                    <span class="column-title">第 1 列</span>
                </div>
                <div class="noun-list" id="nounList0"></div>
                <div class="add-noun-input">
                    <input type="text" class="noun-input" id="nounInput0" placeholder="输入需要排列组合的单个词语或词组后，回车或点击添加按钮">
                    <button class="add-noun-btn" data-column="0">添加</button>
                </div>
            </div>
            <div class="column" data-column-index="1">
                <div class="column-header">
                    <span class="column-title">第 2 列</span>
                    <button class="column-remove" data-remove-column>×</button>
                </div>
                <div class="noun-list" id="nounList1"></div>
                <div class="add-noun-input">
                    <input type="text" class="noun-input" id="nounInput1" placeholder="输入需要排列组合的单个词语或词组后，回车或点击添加按钮">
                    <button class="add-noun-btn" data-column="1">添加</button>
                </div>
            </div>
        </div>
        <div class="manual-wrapper">
            <div class="column" id="manualColumn">
                <div class="column-header">
                    <span class="column-title">单独添加</span>
                </div>
                <div class="noun-list" id="manualList"></div>
                <div class="add-noun-input">
                    <input type="text" class="noun-input" id="manualKeywordInput" placeholder="输入需要单独添加的词语或词组">
                    <button class="add-noun-btn" id="manualAddBtn">添加</button>
                </div>
            </div>
        </div>
        <div class="output-section">
            <span class="output-label">词组预览</span>
            <div class="output-chip-list" id="outputChipList" aria-live="polite"></div>
            <textarea class="output-textarea output-data-source" id="outputTextarea" readonly aria-hidden="true" tabindex="-1"></textarea>
            <div class="output-buttons">
                <div class="generate-hover">
                    <button class="copy-btn generate-btn" id="generateBtn">编辑并导出结果</button>
                    <span class="generate-hint">（进入确认页面，导出前可对以上结果进行调整删改）</span>
                </div>
                <div class="top-actions-right">
                    <button class="add-column-btn feishu-sheet-btn" id="feishuDocBtn">飞书文档登记</button>
                    <button class="add-column-btn feishu-sheet-btn" id="feishuSheetBtn">飞书表格落表</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal" role="dialog" aria-modal="true">
            <div class="modal-header">
                <div class="modal-title">生成结果</div>
                <button class="modal-close" id="resultModalCloseBtn">×</button>
            </div>
            <div class="modal-body">
                <div class="result-list" id="resultList"></div>
                <div class="modal-actions">
                    <button class="danger-btn" id="deleteSelectedBtn">删除选中</button>
                    <div class="output-buttons">
                        <button class="copy-btn" id="copyBtn">复制结果并跳转至业务安全平台</button>
                        <button class="export-excel-btn" id="exportExcelBtn">导出文件并跳转至IMC加词</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="app-config.js"></script>
    <script src="index.js?v=20260809-1"></script>
</body>
</html>
